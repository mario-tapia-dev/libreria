<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Prestamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17324d; --aqua: #0c8d87; --paper: #f4f7f6; --accent: #e5a93f; }
        body { background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
        .navbar { background: var(--ink); }
        .brand-mark { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
        .page-header { border-bottom: 3px solid var(--accent); }
        .panel { background: #fff; border: 1px solid #d9e1df; border-radius: 6px; box-shadow: 0 8px 20px rgb(23 50 77 / 8%); }
        .table thead th { color: #fff; background: var(--ink); white-space: nowrap; }
        .btn-primary { background: var(--aqua); border-color: var(--aqua); }
        .btn-primary:hover { background: #08736e; border-color: #08736e; }
        .form-control:focus, .form-select:focus { border-color: var(--aqua); box-shadow: 0 0 0 .2rem rgb(12 141 135 / 18%); }
        @media (max-width: 767px) { .table { font-size: .86rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand brand-mark" th:href="@{/vista/prestamos}">BIBLIOTECA</a>
            <span class="navbar-text text-white-50">Prestamos</span>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="page-header d-flex justify-content-between align-items-end mb-4 pb-3">
            <div>
                <p class="text-uppercase small mb-1 text-secondary">Administracion</p>
                <h1 class="h2 mb-0">Prestamos</h1>
            </div>
            <span class="badge text-bg-light border" th:text="${#lists.size(prestamos)} + ' registrados'">0 registrados</span>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Registrar prestamo</h2>
                    <form th:action="@{/vista/prestamos/guardar}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="libroIsbn">Libro</label>
                            <select id="libroIsbn" class="form-select" name="libroIsbn" required>
                                <option th:each="l : ${libros}" th:value="${l.isbn}" th:text="${l.titulo}"></option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="socioId">Socio</label>
                            <select id="socioId" class="form-select" name="socioId" required>
                                <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre}"></option>
                            </select>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Registrar prestamo</button>
                    </form>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="panel p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Historial</h2><input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar libro o socio"></div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaPrestamos">
                            <thead><tr><th>ID</th><th>Libro</th><th>Socio</th><th>Prestado</th><th>Devuelto</th><th class="text-end">Acciones</th></tr></thead>
                            <tbody>
                                <tr th:each="p : ${prestamos}">
                                    <td th:text="${p.id}"></td>
                                    <td th:text="${p.libro.titulo}"></td>
                                    <td th:text="${p.socio.nombre}"></td>
                                    <td th:text="${p.fechaPrestamo}"></td>
                                    <td th:text="${p.fechaDevolucion} ?: 'Pendiente'"></td>
                                    <td class="text-end text-nowrap">
                                        <form class="d-inline" th:if="${p.fechaDevolucion == null}" th:action="@{/vista/prestamos/{id}/devolucion(id=${p.id})}" method="post">
                                            <button class="btn btn-outline-primary btn-sm" type="submit">Marcar devuelto</button>
                                        </form>
                                        <form class="d-inline" th:action="@{/vista/prestamos/{id}/eliminar(id=${p.id})}" method="post">
                                            <button class="btn btn-outline-danger btn-sm" type="submit" onclick="return confirm('Eliminar este prestamo?')">Eliminar</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(prestamos)}"><td colspan="6" class="text-center text-secondary py-4">No hay prestamos registrados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('buscador').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#tablaPrestamos tbody tr').forEach(function (row) {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
